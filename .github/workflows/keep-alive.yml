# Supabase Free projects pause after ~7 days without activity. GET /api/status
# runs a database query (clip job queue counts, server/app.js), so a daily
# hit keeps the project awake. Deliberately not part of deploy.yml: a ping is
# not a release gate. A failing run (non-2xx) emails the owner via GitHub.
name: Keep alive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 https://phrase-drill.onrender.com/api/status
