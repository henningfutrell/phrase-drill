# phrase-drill server (T041/T050) — LOCAL DEV ONLY. Production runs on
# Render from render.yaml (T053), which this file has no bearing on: Render
# does not run docker-compose. `docker compose up --build` runs the whole
# stack locally with no cloud account: the app and Postgres, nothing else —
# the app authenticates its one user itself (T050), so there is no third
# service to run or an account with a vendor to hold. Set provider keys in a
# `.env` file next to this one (git-ignored) — `.env.example` documents
# every variable.
#
# `docker compose down` alone leaves a container running if its service has
# since been deleted from this file — pass `--remove-orphans` (or use `down
# --remove-orphans` habitually) to actually stop everything.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-phrase_drill}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-phrase_drill}'
      POSTGRES_DB: '${POSTGRES_DB:-phrase_drill}'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phrase-drill:
    build:
      context: .
    ports:
      - '8080:8080'
    environment:
      PORT: '8080'
      DATABASE_URL: 'postgres://${POSTGRES_USER:-phrase_drill}:${POSTGRES_PASSWORD:-phrase_drill}@postgres:5432/${POSTGRES_DB:-phrase_drill}'
      ELEVENLABS_API_KEY: '${ELEVENLABS_API_KEY:-}'
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY:-}'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
