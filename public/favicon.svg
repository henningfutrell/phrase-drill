<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    Browser-tab favicon: the same rose de mai as public/icons/icon-source.svg,
    redrawn for 16px rather than scaled down to it.

    Three differences from the app icon, all forced by the size:
      - it keeps its own aubergine ground instead of sitting transparent on the
        browser's chrome, because a gilt outline on a light tab bar disappears;
      - the medallion ring is dropped — at 16px it closes up against the petal
        tips and the mark turns into a blob;
      - the stroke is proportionally heavier (2.6 at 64 against 9 at 512), since
        a hairline that reads at 512 vanishes at 16.
    A favicon is a different drawing of the same idea, not the icon shrunk.
  -->
  <rect width="64" height="64" rx="13" fill="#191016"/>
  <g fill="none" stroke="#c8a56e" stroke-width="2.6" stroke-linecap="round">
    <ellipse cx="32" cy="19" rx="7.6" ry="11"/>
    <ellipse cx="32" cy="19" rx="7.6" ry="11" transform="rotate(72 32 32)"/>
    <ellipse cx="32" cy="19" rx="7.6" ry="11" transform="rotate(144 32 32)"/>
    <ellipse cx="32" cy="19" rx="7.6" ry="11" transform="rotate(216 32 32)"/>
    <ellipse cx="32" cy="19" rx="7.6" ry="11" transform="rotate(288 32 32)"/>
    <circle cx="32" cy="32" r="4.4" stroke="#e3adbb"/>
  </g>
</svg>
