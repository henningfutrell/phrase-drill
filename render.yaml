# Render Blueprint. Render does not run docker-compose.yml — that file is
# local-dev only. Production topology: the server runs here as one web
# service built from the Dockerfile; the database, Auth and Storage are
# Supabase (Free tier, decision D1 in docs/backup.md). See docs/deploy.md.
#
# Web service `free` (owner decision 2026-10-05, at the Supabase cutover): the
# app is ~23 MiB RSS, so it fits. The costs are accepted: the service spins
# down after 15 min idle (the first request after that waits for a cold start,
# about a minute), Clip jobs queued in-process stop while it sleeps and resume
# on the next request, and there is no Shell tab — run the scripts from a
# machine with the Supabase credentials instead (docs/deploy.md).
#
# DECOMMISSION: the `databases:` block below is the OLD Render Postgres. It
# is kept until day +30 after cutover as a rollback copy and no service reads
# it. **Removing it from a synced Blueprint may delete the database.** Check
# the Blueprint sync preview in the Render dashboard before deleting the
# block, and take a backup.mjs dump first.

databases:
  - name: phrase-drill-db
    plan: basic-256mb
    databaseName: phrase_drill
    user: phrase_drill
    region: oregon

services:
  - type: web
    name: phrase-drill
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # A fix that is merged but not deployed does not exist for them. The earlier
    # diagnosis here was that auto-deploy had never been declared, so the
    # service ran on an unreadable dashboard default and one Blueprint sync
    # would bind it to this file. **That diagnosis is superseded, 2026-08-24.**
    # The owner confirmed the service is linked by **public Git repository
    # URL**, not through a connected GitHub account. Render's docs are explicit:
    # services using "a public Git repository URL ... must be deployed manually"
    # (https://render.com/docs/deploys#automatic-deploys). The service was never
    # *eligible* for auto-deploy — no dashboard setting and no Blueprint sync can
    # make it so — and the dashboard's Auto-Deploy dropdown still displays "On
    # Commit" (the default for a new service), which is why this read as
    # configured and working for three weeks. Cost: two round trips through a
    # non-technical user in another country, 2026-08-04 and 2026-08-24.
    #
    # `autoDeploy: true` below therefore has **no effect on this service**. It is
    # kept rather than deleted: it is the correct declaration the day the service
    # is reconnected through the GitHub account. Note it is also **deprecated** in
    # the current Blueprint spec in favour of `autoDeployTrigger: commit`
    # (https://render.com/docs/blueprint-spec) — `autoDeploy: true` is still
    # honoured, and `autoDeployTrigger` takes precedence if both are present.
    #
    # The fix needs the owner; both options are written up in docs/deploy.md
    # "Shipping a change after the one-time setup".
    autoDeploy: true
    envVars:
      # Supabase session pooler (port 5432), no `sslmode=` in the URL —
      # server/db.js#sslConfigFor pins the CA. Value is set in the dashboard.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Public values, but per-project, so they are not hard-coded here.
      # Build-time for the PWA bundle (Vite reads VITE_* during `docker build`).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # PORT: Render injects this itself for every web service; not set
      # here, and server/index.js already reads it (falls back to 8080
      # only for local/non-Render runs).
      # Both provider keys are `sync: false` — Render prompts for them in
      # its dashboard on first deploy and stores them itself; neither value
      # ever enters this repo. See docs/deploy.md.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
