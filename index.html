<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>phrase-drill</title>

    <!--
      iOS Safari does not read the web app manifest for these — each has to
      be a head tag of its own, or "Add to Home Screen" silently falls back
      to a Safari-chrome tab instead of a standalone app. See docs/pwa.md.
    -->
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      `default` renders a light status bar with dark text — wrong against
      the design's dark-by-default background (docs/design.md).
      `black-translucent` lets the app's own dark background show through,
      with light status-bar text/icons, matching the rest of the app.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="phrase-drill" />

    <!--
      The ground, painted before any CSS parses. Without this the first frame
      of a cold launch is the browser's white, which against an aubergine app
      reads as a flash on every open (T058).
    -->
    <meta name="theme-color" content="#191016" />

    <!--
      Both faces are needed by the first screen she sees — Pinyon for the login
      title, Garamond for the fields — so both are preloaded rather than
      discovered a stylesheet later. `crossorigin` is required on a font
      preload even same-origin; without it the browser fetches the file twice.
      Italic is deliberately NOT preloaded: it appears only in hints and
      placeholders, well after first paint.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/eb-garamond-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/pinyon-script-latin-400-normal.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
